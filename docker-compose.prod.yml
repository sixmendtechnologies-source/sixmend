services:
  sixmend-landing:
    image: ${IMAGE}
    container_name: sixmend-app
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true