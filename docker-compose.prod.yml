services:
  sixmend-landing:
    image: ${IMAGE}
    container_name: sixmend-web
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true