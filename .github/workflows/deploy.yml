name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ECR_REGISTRY: 555292118815.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: frontend
  AWS_REGION: ap-south-1
  PROJECT_NAME: sixmend-web
  CONTAINER_NAME: sixmend-web   # must match container_name in docker-compose.prod.yml

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    outputs:
      new-tag: ${{ steps.version.outputs.new_tag }}
      previous-tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve next version
        id: version
        run: |
          LATEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[].imageTags[]' \
            --output text \
            | tr '\t' '\n' \
            | grep -E '^${{ env.PROJECT_NAME }}-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)

          SENTINEL="${{ env.PROJECT_NAME }}-v1.1.0"
          LATEST=${LATEST:-$SENTINEL}
          echo "Current version: $LATEST"

          VERSION="${LATEST#${{ env.PROJECT_NAME }}-v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then patch=1; minor=$((minor + 1)); fi
          if [ "$minor" -ge 10 ]; then minor=1; major=$((major + 1)); fi
          NEW_TAG="${{ env.PROJECT_NAME }}-v${major}.${minor}.${patch}"
          echo "New version:     $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$SENTINEL" ]; then
            echo "previous_tag=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "previous_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.new_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR login token for server
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Prepare image references
        id: images
        run: |
          NEW_TAG="${{ needs.docker.outputs.new-tag }}"
          PREV_TAG="${{ needs.docker.outputs.previous-tag }}"
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${NEW_TAG}" >> $GITHUB_OUTPUT
          if [ -n "$PREV_TAG" ]; then
            echo "previous_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${PREV_TAG}" >> $GITHUB_OUTPUT
          else
            echo "previous_image=" >> $GITHUB_OUTPUT
          fi

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: docker-compose.prod.yml
          target: ~/sixmend

      - name: Deploy via SSH with rollback
        uses: appleboy/ssh-action@v1
        env:
          ECR_TOKEN: ${{ steps.ecr-token.outputs.token }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE: ${{ steps.images.outputs.image }}
          PREVIOUS_IMAGE: ${{ steps.images.outputs.previous_image }}
          NEW_TAG: ${{ needs.docker.outputs.new-tag }}
          PREVIOUS_TAG: ${{ needs.docker.outputs.previous-tag }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: ECR_TOKEN,ECR_REGISTRY,IMAGE,PREVIOUS_IMAGE,NEW_TAG,PREVIOUS_TAG,CONTAINER_NAME
          script: |
            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"; }

            log "Deploying $NEW_TAG  (rollback target: ${PREVIOUS_TAG:-none})"

            echo "$ECR_TOKEN" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            cd ~/sixmend

            # Write .env so docker compose resolves IMAGE here and on the server
            echo "IMAGE=$IMAGE" > .env
            log ".env written with IMAGE=$IMAGE"

            log "Pulling $IMAGE ..."
            if ! docker compose -f docker-compose.prod.yml pull; then
              log "ERROR: Pull failed. Deployment aborted — server unchanged."
              exit 1
            fi

            log "Starting container..."
            docker compose -f docker-compose.prod.yml up -d

            # Poll Docker health status — up to 60s (12 × 5s)
            log "Waiting for container to become healthy..."
            RESULT="timeout"
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "missing")
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "none")
              log "[$i/12] status=$STATUS  health=$HEALTH"
              if [ "$STATUS" != "running" ]; then RESULT="crashed";   break; fi
              if [ "$HEALTH" = "healthy" ];   then RESULT="healthy";  break; fi
              if [ "$HEALTH" = "unhealthy" ]; then RESULT="unhealthy"; break; fi
              sleep 5
            done
            log "Final result: $RESULT"

            if [ "$RESULT" = "healthy" ]; then
              log "Deployment successful — running $NEW_TAG"
              docker image prune -f
              exit 0
            fi

            # ── ROLLBACK ─────────────────────────────────────────────────────
            log "ROLLBACK TRIGGERED — $NEW_TAG failed health check (result=$RESULT)"
            log "Last 50 lines from failed container:"
            docker logs "$CONTAINER_NAME" --tail 50 2>&1 | sed 's/^/  [container] /'

            if [ -n "$PREVIOUS_IMAGE" ]; then
              log "Pulling $PREVIOUS_TAG from ECR..."
              docker pull "$PREVIOUS_IMAGE"
              log "Reverting to $PREVIOUS_TAG..."
              # Revert .env so server reflects the rolled-back image
              echo "IMAGE=$PREVIOUS_IMAGE" > .env
              docker compose -f docker-compose.prod.yml up -d
              sleep 5
              RB_STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "missing")
              log "Rollback container status: $RB_STATUS"
              log "ROLLBACK COMPLETE — site is serving $PREVIOUS_TAG"
            else
              log "No previous version available. Cannot roll back."
            fi

            exit 1
