name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_NAME: sixmend-web
  CONTAINER_NAME: sixmend-web   # must match container_name in docker-compose.prod.yml
  DEPLOY_DIR: ~/sixmend

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      new-tag: ${{ steps.version.outputs.new_tag }}
      previous-tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PACKAGE_NAME="${{ env.PROJECT_NAME }}"
          SENTINEL="${{ env.PROJECT_NAME }}-v1.1.0"

          # Try user packages API, fall back to org packages API
          LATEST=$(
            (curl -sfL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              2>/dev/null ||
            curl -sfL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              2>/dev/null) \
            | jq -r '.[].metadata.container.tags[]? // empty' \
            | grep -E "^${PACKAGE_NAME}-v[0-9]+\.[0-9]+\.[0-9]+\$" \
            | sort -V \
            | tail -1 \
            || true)

          LATEST=${LATEST:-$SENTINEL}
          echo "Current version: $LATEST"

          VERSION="${LATEST#${PACKAGE_NAME}-v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then patch=1; minor=$((minor + 1)); fi
          if [ "$minor" -ge 10 ]; then minor=1; major=$((major + 1)); fi
          NEW_TAG="${PACKAGE_NAME}-v${major}.${minor}.${patch}"
          echo "New version:     $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$SENTINEL" ]; then
            echo "previous_tag=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "previous_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sixmend-web:${{ steps.version.outputs.new_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Get GHCR login token for server
        id: ghcr-token
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Prepare image references
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NEW_TAG="${{ needs.docker.outputs.new-tag }}"
          PREV_TAG="${{ needs.docker.outputs.previous-tag }}"
          REGISTRY="ghcr.io/${OWNER}/sixmend-web"
          echo "image=${REGISTRY}:${NEW_TAG}" >> $GITHUB_OUTPUT
          if [ -n "$PREV_TAG" ]; then
            echo "previous_image=${REGISTRY}:${PREV_TAG}" >> $GITHUB_OUTPUT
          else
            echo "previous_image=" >> $GITHUB_OUTPUT
          fi

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy via SSH with rollback
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ steps.ghcr-token.outputs.token }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE: ${{ steps.images.outputs.image }}
          PREVIOUS_IMAGE: ${{ steps.images.outputs.previous_image }}
          NEW_TAG: ${{ needs.docker.outputs.new-tag }}
          PREVIOUS_TAG: ${{ needs.docker.outputs.previous-tag }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,PREVIOUS_IMAGE,NEW_TAG,PREVIOUS_TAG,CONTAINER_NAME,DEPLOY_DIR
          script: |
            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"; }

            log "Deploying $NEW_TAG  (rollback target: ${PREVIOUS_TAG:-none})"

            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

            cd "${DEPLOY_DIR/#\~/$HOME}"

            # Write .env so docker compose resolves IMAGE here and on the server
            echo "IMAGE=$IMAGE" > .env
            log ".env written with IMAGE=$IMAGE"

            log "Pulling $IMAGE ..."
            if ! docker compose -f docker-compose.prod.yml pull; then
              log "ERROR: Pull failed. Deployment aborted — server unchanged."
              exit 1
            fi

            log "Starting container..."
            docker compose -f docker-compose.prod.yml up -d

            # Poll Docker health status — up to 60s (12 × 5s)
            log "Waiting for container to become healthy..."
            RESULT="timeout"
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "missing")
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "none")
              log "[$i/12] status=$STATUS  health=$HEALTH"
              if [ "$STATUS" != "running" ]; then RESULT="crashed";   break; fi
              if [ "$HEALTH" = "healthy" ];   then RESULT="healthy";  break; fi
              if [ "$HEALTH" = "unhealthy" ]; then RESULT="unhealthy"; break; fi
              sleep 5
            done
            log "Final result: $RESULT"

            if [ "$RESULT" = "healthy" ]; then
              log "Deployment successful — running $NEW_TAG"
              docker image prune -f
              exit 0
            fi

            # ── ROLLBACK ─────────────────────────────────────────────────────
            log "ROLLBACK TRIGGERED — $NEW_TAG failed health check (result=$RESULT)"
            log "Last 50 lines from failed container:"
            docker logs "$CONTAINER_NAME" --tail 50 2>&1 | sed 's/^/  [container] /'

            if [ -n "$PREVIOUS_IMAGE" ]; then
              log "Pulling $PREVIOUS_TAG from GHCR..."
              docker pull "$PREVIOUS_IMAGE"
              log "Reverting to $PREVIOUS_TAG..."
              # Revert .env so server reflects the rolled-back image
              echo "IMAGE=$PREVIOUS_IMAGE" > .env
              docker compose -f docker-compose.prod.yml up -d
              sleep 5
              RB_STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "missing")
              log "Rollback container status: $RB_STATUS"
              log "ROLLBACK COMPLETE — site is serving $PREVIOUS_TAG"
            else
              log "No previous version available. Cannot roll back."
            fi

            exit 1
