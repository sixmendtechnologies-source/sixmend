version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sixmend-web        # central nginx uses this name to reach Next.js
    expose:
      - "3000"                         # internal only — nginx-proxy handles 80/443
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true                     # shared network created on host
